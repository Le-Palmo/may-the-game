<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>May the Game Be With You</title>
<meta name="description" content="Party game of movies, shows, video games and anime.">
<meta name="theme-color" content="#FFF6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1823" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="May the Game">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bagel Fat One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bagel-fat-one.woff2) format("woff2")}
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one-column phone screen, a pastel card table. Each category owns one pastel; ink stays plum. */
:root{
  --bg:#FFF6F3; --surface:#FFFFFF; --ink:#2E2335; --muted:#806F86; --line:#F0E2E5;
  --corn:#FFEDB0; --pop:#F48BA5;
  --c-casting:#CDBAF3; --c-bloopers:#FFC4A3; --c-soundtrack:#ADE5CA; --c-spoiler:#FFB3C6; --c-marathon:#B3D5F6; --c-script:#F9DF95;
  --on-cat:#2E2335; --ok:#2F9A6C; --bad:#D94B66;
  /* icon inks are fixed: icons always sit on a pastel category color */
  --i-line:#2E2335; --i-fill:#FFFDF9; --i-corn:#FFE08F; --i-pop:#F27C9B;
  --f-display:"Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --ease-spring:cubic-bezier(.2,.9,.25,1);
  --ease-bounce:cubic-bezier(.34,1.45,.5,1);
  --barH:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1823; --surface:#2A2231; --ink:#F7EEF3; --muted:#B6A7BC; --line:#3B3044; --corn:#F5DE92; --pop:#F48BA5;
  --c-casting:#BBA6EA; --c-bloopers:#F5B592; --c-soundtrack:#98D8B9; --c-spoiler:#F4A0B6; --c-marathon:#9FC5EC; --c-script:#EFD283;
  --ok:#6FD3A3; --bad:#FF8DA2; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1823; --surface:#2A2231; --ink:#F7EEF3; --muted:#B6A7BC; --line:#3B3044; --corn:#F5DE92; --pop:#F48BA5;
  --c-casting:#BBA6EA; --c-bloopers:#F5B592; --c-soundtrack:#98D8B9; --c-spoiler:#F4A0B6; --c-marathon:#9FC5EC; --c-script:#EFD283;
  --ok:#6FD3A3; --bad:#FF8DA2; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px;line-height:1}
.mark svg{width:28px;height:28px}
.ghost{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--surface)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;border-radius:999px;font-weight:800;font-size:17px;
  background:var(--ink);color:var(--bg);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:18px}
.hero svg.big{width:132px;height:132px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.98;letter-spacing:-.01em}
.hero h1 span{display:block;color:var(--pop)}
.edition{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--corn);color:var(--on-cat);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.catstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catchip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;color:var(--on-cat);font-weight:700;font-size:13px;text-align:center}
.catchip svg{width:34px;height:34px}

/* setup */
.field{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);padding:10px 0;outline:none}
.field .x{width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:20px}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;background:var(--pop)}

/* scoreboard */
.board{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.team{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1.5px solid var(--line)}
.team:first-child{border-top:0}
.team.on{background:color-mix(in srgb,var(--corn) 45%,var(--surface))}
.team .name{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.on .name::before{content:"▸ ";color:var(--pop)}
.pips{display:flex;gap:4px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--cat);background:transparent}
.pip.has{background:var(--cat)}
.total{min-width:30px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.total small{font-weight:600;color:var(--muted);font-size:11px;display:block;line-height:1}

/* die */
.dieWrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.die{width:150px;height:150px;border-radius:36px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);
  box-shadow:0 10px 0 -2px var(--line);color:var(--on-cat);transition:background .1s}
.die.face{border-color:transparent;box-shadow:0 10px 0 -2px color-mix(in srgb,var(--ink) 18%,transparent)}
.die svg{width:84px;height:84px}
.die.rolling{animation:shake .14s infinite}
@keyframes shake{0%{transform:rotate(-8deg) scale(.97)}50%{transform:rotate(8deg) scale(1.03)}100%{transform:rotate(-8deg) scale(.97)}}
.pipface{display:grid;grid-template-columns:repeat(2,26px);gap:14px 30px}
.pipface i{width:26px;height:26px;border-radius:50%;display:block}
.turnHead{text-align:center;display:flex;flex-direction:column;gap:4px}
.turnHead h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05}

/* category banner */
.catBanner{border-radius:24px;padding:18px;color:var(--on-cat);display:flex;flex-direction:column;gap:8px}
.catBanner .t{display:flex;align-items:center;gap:10px}
.catBanner .t svg{width:38px;height:38px;flex:none}
.catBanner h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.catBanner p{font-size:15px}
.catBanner b{font-weight:800}

/* playing card */
.card{border-radius:26px;background:var(--surface);border:2px solid var(--cat);overflow:hidden;display:flex;flex-direction:column}
.card .head{background:var(--cat);color:var(--on-cat);display:flex;align-items:center;gap:10px;padding:12px 16px}
.card .head svg{width:28px;height:28px;margin:-3px 0}
.card .head .nm{flex:1;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.card .head .no{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:18px 16px;border-top:1.5px dashed var(--line);width:100%}
.opt:first-of-type{border-top:0}
.opt .ab{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;background:color-mix(in srgb,var(--cat) 45%,var(--surface));color:var(--ink)}
.opt .main{font-weight:800;font-size:18px;line-height:1.25}
.opt .sub{color:var(--muted);font-size:14px;margin-top:3px}
button.opt:active{background:color-mix(in srgb,var(--cat) 18%,var(--surface))}
.card .foot{padding:10px 16px;font-size:13px;color:var(--muted);border-top:1.5px solid var(--line)}

/* challenge */
.prompt{border-radius:26px;background:var(--surface);border:2px solid var(--cat);padding:22px 18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.prompt .big{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.08}
.prompt .quote{font-size:24px;font-weight:800;line-height:1.25}
.prompt .quote:not(.noq)::before{content:"“"}.prompt .quote:not(.noq)::after{content:"”"}
.banned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.banned span{padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);font-weight:700;font-size:14px;text-decoration:line-through}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;width:100%}
.ans .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cat);color:var(--on-cat);font-size:13px;font-weight:800}
.ans.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.ans.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.ans[disabled]{cursor:default}

/* timer */
.timer{position:relative;width:150px;height:150px;margin:0 auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:12}
.timer .track{stroke:var(--line)}
.timer .run{stroke:var(--cat);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:46px;font-variant-numeric:tabular-nums}
.timer.done .num{color:var(--bad);font-size:22px}

.note{padding:14px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:15px}
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 8px}
.gate .eye{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--cat);color:var(--on-cat)}
.gate .eye svg{width:50px;height:50px}
.gate h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}

/* marathon battle */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel div{padding:14px 10px;border-radius:18px;text-align:center;font-weight:800;border:2px solid var(--line);background:var(--surface);min-width:0;overflow-wrap:anywhere}
.duel div.now{border-color:var(--ink);background:var(--cat);color:var(--on-cat)}
.duel small{display:block;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.count{text-align:center;font-weight:700;color:var(--muted)}

/* result + winner */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:20px 0}
.result .badge{width:110px;height:110px;border-radius:34px;display:grid;place-items:center;color:var(--on-cat);transform:rotate(-6deg)}
.result .badge svg{width:64px;height:64px}
.result h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.02}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;border-radius:50%;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}

/* rules + browse */
.rule{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line)}
.rule .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cat);color:var(--on-cat)}
.rule .ic svg{width:30px;height:30px}
.rule h3{font-size:16px;font-weight:800}
.rule p{font-size:14.5px;color:var(--muted)}
.rule p b{color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface)}
.tabs button.on{background:var(--cat);border-color:var(--cat);color:var(--on-cat)}
.list{display:flex;flex-direction:column;gap:12px}
.h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}

.qrmini{flex:none;width:58px;height:58px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff;display:block}
.qrmini svg,.qrbig svg{display:block;width:100%;height:100%}
.listen{border-radius:20px;background:color-mix(in srgb,var(--cat) 30%,var(--surface));padding:4px 14px;text-align:left}
.listen summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
.listen summary::-webkit-details-marker{display:none}
.listen summary::after{content:"+";margin-left:auto;font-size:20px}
.listen[open] summary::after{content:"–"}
.listen .in{display:flex;gap:14px;align-items:center;padding:4px 0 14px}
.qrbig{flex:none;width:128px;height:128px;border-radius:14px;overflow:hidden;background:#fff;border:1.5px solid var(--line)}
.listen a{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:999px;background:#1DB954;color:#0B2414;font-weight:800;text-decoration:none;font-size:14px}
.mute{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.mute svg{width:20px;height:20px}
.bar .right{display:flex;gap:8px;align-items:center}
.catchip.pick{border:2px solid transparent}
.catchip.pick small{font-size:11px;font-weight:700;opacity:.75}
.catchip.pick.cur{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2: always-visible scoreboard, undo/correct, modes */
.board.sticky{position:sticky;top:var(--barH);z-index:4;box-shadow:0 6px 16px -10px color-mix(in srgb,var(--ink) 40%,transparent)}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px 14px;border-bottom:1.5px solid var(--line)}
.link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink);padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--corn) 60%,var(--surface))}
.link svg{width:15px;height:15px}
.board .team{padding:9px 12px;gap:8px}
.team .name{display:flex;flex-direction:column;line-height:1.15}
.team .name small{font-weight:600;font-size:11px;color:var(--muted)}
.board .team .name{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;font-size:14.5px}
.chips{display:grid;grid-template-columns:repeat(6,24px);gap:4px;flex:none}
.chip{position:relative;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:2px dashed color-mix(in srgb,var(--cat) 80%,var(--line));background:transparent}
.chip svg{width:17px;height:17px;opacity:.28;filter:grayscale(1)}
.chip.has{background:var(--cat);border:2px solid var(--cat)}
.chip.has svg{opacity:1;filter:none}
.chip b{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;line-height:16px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:7px 12px 9px;border-top:1.5px solid var(--line);font-size:11px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--cat)}
.rank{min-width:18px;font-weight:800}
.mark small.modetag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--corn);color:var(--on-cat);font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.ghost.undo{display:inline-flex;align-items:center;gap:5px;padding:8px 11px}
.ghost.undo svg{width:16px;height:16px}
.ghost.fix{font-size:13px;margin-top:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.mode b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.05}
.mode small{font-size:12.5px;color:var(--muted);line-height:1.25}
.mode.cur{border-color:var(--ink);background:color-mix(in srgb,var(--corn) 55%,var(--surface))}
.ans.sel{outline:2px solid var(--ink);outline-offset:1px}
.editTeam{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.erow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.eic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--cat);flex:none}
.eic svg{width:22px;height:22px}
.step{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-weight:800;display:grid;place-items:center}
.step[disabled]{opacity:.35;cursor:default}
.cnt{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px) scale(.94);filter:blur(6px);opacity:0;pointer-events:none;
  background:color-mix(in srgb,var(--ink) 86%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;
  box-shadow:0 10px 30px -10px color-mix(in srgb,var(--ink) 50%,transparent);transition:transform .35s var(--ease-spring),opacity .2s,filter .25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);filter:none}
/* v6: Apple-style polish — instant press feedback, 44pt targets, translucent chrome, gentle motion */
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ghost,.mute,.link,.step,.mode,.catchip.pick,.ans,button.opt,.tabs button,.btn{transition:transform .12s var(--ease-spring),background-color .15s,border-color .15s}
.ghost:active,.mute:active,.link:active,.step:active,.mode:active,.catchip.pick:active,.ans:active,.tabs button:active{transform:scale(.95)}
button.opt:active{transform:scale(.985)}
.ghost{min-height:44px}
.tabs button{min-height:40px}
.link{position:relative;padding:6px 10px}
.link::after{content:"";position:absolute;inset:-7px -4px}
.bar{position:sticky;top:0;z-index:6;margin:-14px -16px 0;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;background:linear-gradient(color-mix(in srgb,var(--bg) 60%,transparent),transparent)}
.mark span{letter-spacing:-.01em}
.h2,.turnHead h2,.result h2,.gate h2,.catBanner h2,.prompt .big{letter-spacing:-.01em}
.eyebrow{letter-spacing:.08em}
#app.enter > :not(.bar):not(.board):not(.confetti):not(.toast){animation:screenIn .34s var(--ease-spring) both}
#app.enter > :nth-child(3){animation-delay:.02s}#app.enter > :nth-child(4){animation-delay:.04s}#app.enter > :nth-child(n+5){animation-delay:.06s}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result .badge{animation:badgeIn .55s var(--ease-bounce) both}
@keyframes badgeIn{from{opacity:0;transform:rotate(-6deg) scale(.6)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.die.face{transition:background .1s,transform .3s var(--ease-bounce)}
@media (prefers-reduced-motion: reduce){
  #app.enter > *{animation:screenFade .2s ease both!important}
  @keyframes screenFade{from{opacity:0}to{opacity:1}}
  .toast{transform:translate(-50%,0);filter:none}
}
@media (prefers-reduced-transparency: reduce){
  .bar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .toast{background:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast: more){
  :root{--line:#9C8AA2;--muted:#5E4F64}
  .bar{background:var(--bg);border-bottom:1.5px solid var(--ink)}
}
.bi{display:flex;flex-direction:column;gap:3px}
.bi .es{font-size:.86em;font-weight:500;font-style:italic;opacity:.8}
.gate h2 .es{font-family:var(--f-body);font-size:17px;font-weight:700;margin-top:4px}
.prompt .eyebrow .es{letter-spacing:.06em}
.duel div.out{opacity:.45;text-decoration:line-through}
.prompt .quote.esq{font-size:18px;font-weight:600;font-style:italic;opacity:.8;margin-top:-4px}
/* v3: hold-to-peek so the game can be projected */
.peek{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;background:var(--pop);color:var(--on-cat);transition:transform .1s,background .1s}
.peek svg{width:26px;height:26px;flex:none}
.peek .bi{text-align:left}
body.peeking .peek{transform:scale(.97);background:var(--ink);color:var(--bg)}
.secretBox{position:relative}
.secretBox .hid{visibility:hidden}
body.peeking .secretBox .hid{visibility:visible}
.secretBox .grow{position:relative}
.secretBox .ph{position:absolute;inset:0;display:flex;align-items:center;font-weight:700;color:var(--muted)}
body.peeking .secretBox .ph{visibility:hidden}
.prompt.secretBox{min-height:220px}
.prompt.secretBox .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;font-weight:700;color:var(--ink);border-radius:24px;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--cat) 30%,var(--surface)) 0 14px,var(--surface) 14px 28px)}
.cover .eye{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--cat);color:var(--on-cat)}
.cover .eye svg{width:32px;height:32px}
body.peeking .prompt.secretBox .cover{display:none}
@media (min-width:1000px){#app{zoom:1.25}}
@media (max-width:400px){.ghost.undo span{display:none}.ghost.undo{padding:8px 10px}}
@media (max-width:360px){.chips{grid-template-columns:repeat(6,22px)}.chip{width:22px;height:22px}.chip svg{width:15px;height:15px}}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }

          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);

        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {

        r2 = Math.floor((y + 1 - min) / cellSize);

      var max = size - margin;

      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;

  return list.map((n,i)=>{ let name = (typeof n==='string' ? n.trim() : '').slice(0,MAX_NAME) || 'Team '+(i+1);
    const base=name; let k=2; while(seen.has(name.toLowerCase())) name=(base.slice(0,MAX_NAME-3)+' '+k++); seen.add(name.toLowerCase()); return name; });
}
function normalizeGame(g){
  if(!isObj(g) || !Array.isArray(g.teams) || g.teams.length<2 || g.teams.length>4) return null;
  const mode = MODE[g.mode] ? g.mode : 'facil';
  applyMode(mode);
  const names = cleanNames(g.teams.map(t=>t && t.name));
  const teams = g.teams.map((t,i)=>({name:names[i], hand:Object.fromEntries(CATS.map(c=>[c.id, Math.max(0, Math.floor(+(t && t.hand && t.hand[c.id])||0))]))}));
  const decks={}, pos={};
  for(const c of CATS){
    const n=nCards(c.id), d=g.decks && g.decks[c.id];
    const ok = Array.isArray(d) && d.length===n && new Set(d).size===n && d.every(x=>isIdx(x,n));
    decks[c.id] = ok ? d : shuffle([...Array(n).keys()]);
    pos[c.id] = ok && Number.isInteger(g.pos && g.pos[c.id]) ? Math.min(Math.max(0,g.pos[c.id]), n) : 0;
  }
  const roll = CAT[g.roll] ? g.roll : null;
  const card = roll && isIdx(g.card, nCards(roll)) ? g.card : null;
  const choice = card!==null && (g.choice===0 || g.choice===1) ? g.choice : null;
  let order = null, picked = null;
  if(roll==='casting' && choice!==null){
    order = Array.isArray(g.order) && g.order.length===4 && [0,1,2,3].every(k=>g.order.includes(k)) ? g.order : shuffle([0,1,2,3]);
    picked = isIdx(g.picked,4) ? g.picked : null;
  }
  let duel = null;
  if(roll==='marathon' && isObj(g.duel) && Array.isArray(g.duel.alive) && g.duel.alive.length && g.duel.alive.every(i=>isIdx(i,teams.length)))
    duel = {alive:g.duel.alive, pos:isIdx(g.duel.pos,g.duel.alive.length)?g.duel.pos:0, n:Math.max(0,g.duel.n|0), on:false, out:isIdx(g.duel.out,teams.length)?g.duel.out:null};
  const last = isObj(g.last) && CAT[g.last.cat] && isIdx(g.last.team,teams.length)
    ? {ok:!!g.last.ok, cat:g.last.cat, team:g.last.team, note:typeof g.last.note==='string'?g.last.note:null} : null;
  const out = {mode, teams, decks, pos, turn:isIdx(g.turn,teams.length)?g.turn:0, roll, card, choice, order, picked, duel, last,
    winner:isIdx(g.winner,teams.length)?g.winner:null, overtime:!!g.overtime, done:!!g.done, swapped:!!g.swapped,
    rolling:false, started:false, at:null, back:null};
  out.at = validScreen(out, GAME_SCREENS.includes(g.at) ? g.at : 'turn');
  out.back = GAME_SCREENS.includes(g.back) ? validScreen(out, g.back) : null;
  return out;
}
// A game screen is only shown when the state it depends on exists; otherwise fall back to the turn screen.
function validScreen(g, scr){
  const ok = {turn:true, edit:true, final:true, gate:g.card!==null, card:g.card!==null, play:g.choice!==null, result:!!g.last, winner:g.winner!==null};
  return ok[scr] ? scr : 'turn';
}
function normalizeState(raw){
  const S2 = fresh();
  if(!isObj(raw)) return S2;
  S2.mode = MODE[raw.mode] ? raw.mode : 'facil';
  S2.muted = !!raw.muted;
  S2.browse = CAT[raw.browse] ? raw.browse : 'casting';
  const nm = isObj(raw.setup) && raw.setup.names;
  if(Array.isArray(nm) && nm.length>=2 && nm.length<=4) S2.setup.names = nm.map(n=>typeof n==='string' ? n.slice(0,MAX_NAME) : '');
  S2.game = normalizeGame(raw.game);
  S2.hist = S2.game && Array.isArray(raw.hist) ? raw.hist.filter(x=>typeof x==='string').slice(-60) : [];
  let scr = SCREENS.includes(raw.screen) ? raw.screen : 'home';
  if(GAME_SCREENS.includes(scr)) scr = S2.game ? validScreen(S2.game, scr) : 'home';
  S2.screen = scr;
  return S2;
}

function newGame(names){
  applyMode(S.mode);
  const decks = {}, pos = {};
  for (const c of CATS){ decks[c.id] = shuffle([...Array(nCards(c.id)).keys()]); pos[c.id]=0; }
  S.game = {mode:S.mode, teams:names.map(n=>({name:n, hand:emptyHand()})), turn:0, decks, pos,
            roll:null, card:null, choice:null, order:null, picked:null,
            duel:null, overtime:false, winner:null, last:null};
  S.hist = [];
}
const G = () => S.game;
const team = i => G().teams[i];
const rivalOf = i => (i+1) % G().teams.length;
const totalOf = t => Object.values(t.hand).reduce((a,b)=>a+b,0);
const catsOf = t => CATS.filter(c=>t.hand[c.id]>0).length;
const inGame = () => !!(S.game && GAME_SCREENS.includes(S.screen));

function drawCard(){
  const g=G(), id=g.roll, n=nCards(id);
  if (g.pos[id] >= n){ g.decks[id]=shuffle([...Array(n).keys()]); g.pos[id]=0; }
  g.card = g.decks[id][g.pos[id]++];
  g.choice=null; g.order=null; g.picked=null; g.duel=null;
}

/* ---------- undo history ---------- */
function push(){
  if(!S.game) return;
  S.hist = S.hist || [];
  S.hist.push(JSON.stringify({screen:S.screen, game:S.game}));
  if(S.hist.length>60) S.hist.shift();
}
function undo(){
  if(!S.hist || !S.hist.length) return;
  stopTimer(); if(S.game) S.game.rolling=false;
  let snap=null; try{ snap = JSON.parse(S.hist.pop()); }catch(e){}
  const g2 = snap && normalizeGame(snap.game);
  if(!g2){ toast('Nothing to undo'); return; }
  S.game = g2; S.screen = validScreen(g2, snap.screen);
  applyMode(S.game.mode);
  render(); window.scrollTo(0,0);
  const g=G();
  if(S.screen==='play' && g.roll==='marathon' && g.duel && g.duel.on) startTimer(MARATHON_TIME, ACT['duel-out']);
  toast('Last action undone');
}

function toast(msg){

  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }

let T = null, AC = null;
function ctx(){ if(S && S.muted) return null; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f, d, {type='sine', g=.15, at=0, to=null}={}){
  const a=ctx(); if(!a) return; const t=a.currentTime+at, o=a.createOscillator(), v=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
  v.gain.setValueAtTime(.0001,t); v.gain.exponentialRampToValueAtTime(g,t+.012); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t+d+.03);
}
function noise(d, {f=1200, to=null, g=.2, at=0, q=1}={}){
  const a=ctx(); if(!a) return; const t=a.currentTime+at, n=Math.ceil(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=b; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=q;
  fl.frequency.setValueAtTime(f,t); if(to) fl.frequency.exponentialRampToValueAtTime(to,t+d);
  const v=a.createGain(); v.gain.setValueAtTime(g,t); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl).connect(v).connect(a.destination); src.start(t); src.stop(t+d+.02);
}
const sfx = {

  whoosh(){ noise(.35,{f:350,to:3200,g:.22,q:.8}); },
  flip(){ noise(.07,{f:2600,g:.2,q:2}); tone(300,.09,{to:640,g:.07,at:.03}); },
  go(){ [523,659,784].forEach((f,i)=>tone(f,.11,{at:i*.07,g:.07,type:'square'})); },
  tick(){ tone(1350,.028,{type:'square',g:.035}); },
  tickHot(){ tone(1900,.06,{type:'square',g:.07}); tone(950,.06,{type:'square',g:.04}); },
  buzzer(){ haptic([60,40,60]); tone(150,.7,{type:'sawtooth',g:.14}); tone(156,.7,{type:'sawtooth',g:.1}); },
  correct(){ haptic(20); [523,659,784,1047].forEach((f,i)=>tone(f,.24,{at:i*.08,g:.15,type:'triangle'})); },
  wrong(){ haptic([30,50,30]); tone(392,.28,{type:'triangle',g:.17,to:370}); tone(311,.55,{type:'triangle',g:.17,at:.3,to:255}); },
  pops(){ for(let i=0;i<8;i++) noise(.05,{f:800+Math.random()*1000,g:.4,q:3,at:.15+i*.09+Math.random()*.05}); },
  swap(){ tone(660,.09,{g:.1,to:990}); noise(.12,{f:1500,to:3500,g:.08,at:.02}); },
  fanfare(){ const n=[523,523,523,659,784,659,784,1047], d=[.12,.12,.12,.26,.13,.13,.13,.7]; let t=0;
    n.forEach((f,i)=>{ tone(f,d[i]+.05,{at:t,g:.13,type:'triangle'}); tone(f/2,d[i]+.05,{at:t,g:.05,type:'square'}); t+=d[i]; }); this.pops(); },

function stopTimer(){ if(T){ clearInterval(T.iv); T=null; } }
function startTimer(secs, onEnd){
  stopTimer();
  const end = Date.now()+secs*1000;
  T = {secs, end, onEnd, iv:setInterval(tick,200)}; tick();
}
function tick(){
  if(!T) return;
  const left = Math.max(0,(T.end-Date.now())/1000), el=document.getElementById('timer');
  if(el){
    const c = el.querySelector('.run'), len = 2*Math.PI*62;
    c.style.strokeDasharray=len; c.style.strokeDashoffset = len*(1-left/T.secs);
    el.querySelector('.num').textContent = left>0 ? Math.ceil(left) : "Time!";
    el.classList.toggle('done', left<=0);
  }
  if(left<=0){ const f=T.onEnd; stopTimer(); sfx.buzzer(); f && f(); }
  else if(Math.ceil(left)!==T.lastBeep && Math.ceil(left)<T.secs){ T.lastBeep=Math.ceil(left); left<=5 ? sfx.tickHot() : sfx.tick(); }
}

const QRC = {};

function qrSVG(text){
  if(QRC[text]) return QRC[text];
  if(typeof qrcode!=='function') return '';
  const q=qrcode(0,'L'); q.addData(text); q.make(); const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
  return QRC[text]=`<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="QR code to listen to the song"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#2E2335"/></svg>`;
}

/* ---------- render + actions ---------- */
const app = document.getElementById('app');
let lastScreen=null;
function render(){
  if(S.game && inGame()) applyMode(S.game.mode); else applyMode(S.mode);
  let html;
  try{ html = (V[S.screen]||V.home)(); }
  catch(e){ console.error('render failed on', S.screen, e); stopTimer(); S.screen='home'; html=V.home(); setTimeout(()=>toast('Something went wrong. Back to the menu, your game is saved.'),0); }
  app.innerHTML = html; save(); if(T) tick();
  const bar=app.querySelector('.bar'); if(bar) app.style.setProperty('--barH', bar.offsetHeight+'px');
  if(S.screen!==lastScreen){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); lastScreen=S.screen; }
}
function go(screen){ stopTimer(); if(S.game && GAME_SCREENS.includes(screen) && screen!=='edit') S.game.at=screen; S.screen=screen; render(); window.scrollTo(0,0); }

function checkWinner(){
  const g=G();
  if(g.overtime) return false;
  if(g.winner!==null && catsOf(team(g.winner))<CATS.length) g.winner=null;
  if(g.winner===null){ const i=g.teams.findIndex(t=>catsOf(t)===CATS.length); if(i>=0){ g.winner=i; return true; } }
  return false;
}
// finish({ok, winner?, note?}) — winner defaults to the team whose turn it is (Marathon can pass another team)
function finish({ok, winner, note=null}={}){
  stopTimer();
  const g=G(); push(); g.started=false;
  const who = isIdx(winner, g.teams.length) ? winner : g.turn;
  if(ok) team(who).hand[g.roll]++;
  if(g.roll!=='casting') ok ? sfx.correct() : sfx.wrong();
  if(ok) sfx.pops();
  g.last = {ok, cat:g.roll, team:who, note};
  if(ok && checkWinner()){ setTimeout(()=>sfx.fanfare(),350); go('winner'); return; }
  go('result');
}

const ACT = {
  go: el => go(el.dataset.to),
  home: () => go('home'),
  continue: () => { const g=G(); g.started=false; g.rolling=false; if(g.duel) g.duel.on=false; go(g.at || 'turn'); },
  setup: () => { S.setup = {names: S.game ? G().teams.map(t=>t.name) : S.setup.names}; if(S.game) S.mode=S.game.mode; go('setup'); },
  mode: el => { S.mode=el.dataset.id; render(); },
  bmode: el => { S.mode=el.dataset.id; render(); },
  addTeam: () => { const n=S.setup.names; n.push(['Team Popcorn','Team Nachos','Team Soda','Team Candy'].find(x=>!n.includes(x))||'Team '+(n.length+1)); render(); },
  rmTeam: el => { S.setup.names.splice(+el.dataset.i,1); render(); },
  start: () => { newGame(cleanNames(S.setup.names)); wake(); go('turn'); },
  tab: el => { S.browse=el.dataset.id; render(); },
  roll: () => {
    const g=G(); push(); g.rolling=true; g.swapped=false; let k=0, n=14; const final=CATS[Math.floor(Math.random()*6)].id;
    render();
    const spin=()=>{ const die=document.getElementById('die'); if(!die || !g.rolling) return;
      const f = k<n-1 ? CATS[(Math.random()*6)|0].id : final;
      die.classList.add('face'); die.style.background=`var(--c-${f})`; die.innerHTML=ICON[f]; sfx.rattle();
      if(++k<n) setTimeout(spin, 50+k*k*1.6); else { g.rolling=false; g.roll=final; sfx.land(); render(); } };
    spin();
  },
  choose: el => { const g=G(); push(); g.roll=el.dataset.id; g.swapped=true; sfx.land(); render(); },
  draw: () => { push(); drawCard(); sfx.whoosh(); go('gate'); },
  reveal: () => { push(); sfx.flip(); go('card'); },
  repick: () => { push(); drawCard(); sfx.whoosh(); render(); },
  pick: el => {
    const g=G(); push(); g.choice=+el.dataset.k; g.started=false; sfx.flip();
    if(g.roll==='casting'){ g.order=shuffle([0,1,2,3]); g.picked=null; }
    if(g.roll==='marathon') g.duel=newDuel(g);
    go('play');
  },
  answer: el => { const g=G(); const i=+el.dataset.i; if(g.picked===i) return; push(); g.picked=i; g.order[i]===0 ? sfx.correct() : sfx.wrong(); render(); },
  finish: el => finish({ok: el.dataset.ok==='1'}),
  'go-timer': () => { G().started=true; sfx.go(); render(); startTimer(TIME, ()=>{}); },
  'duel-start': () => { const d=G().duel; d.on=true; d.out=null; sfx.go(); render(); startTimer(MARATHON_TIME, ACT['duel-out']); },
  'duel-next': () => { const g=G(); push(); const d=g.duel; d.n++; d.pos=(d.pos+1)%d.alive.length; sfx.swap(); render(); startTimer(MARATHON_TIME, ACT['duel-out']); },
  'duel-out': () => { const g=G(), d=g.duel; stopTimer();
    const lost=d.alive[d.pos];
    if(d.alive.length<=2){ const win=d.alive.find(i=>i!==lost);
      finish({ok:true, winner:win, note: win===g.turn ? null : 'Last team standing in the Marathon.'}); return; }
    push(); d.alive.splice(d.pos,1); d.pos=d.pos%d.alive.length; d.on=false; d.out=lost; sfx.wrong(); render(); },
  flip: () => {
    const g=G(), r=g.last; push();
    r.ok=!r.ok; const h=team(r.team).hand;
    if(r.ok){ h[r.cat]++; r.note=null; sfx.correct(); sfx.pops(); } else { h[r.cat]=Math.max(0,h[r.cat]-1); sfx.wrong(); }
    if(checkWinner()){ setTimeout(()=>sfx.fanfare(),350); go('winner'); return; }
    toast('Result changed'); render();
  },
  edit: () => { push(); S.game.back=S.screen; go('edit'); },
  adj: el => { const g=G(), t=team(+el.dataset.t), c=el.dataset.c; t.hand[c]=Math.max(0,t.hand[c]+(+el.dataset.d)); sfx.tap(); render(); },
  setTurn: el => { G().turn=+el.dataset.i; render(); },
  editDone: () => { const g=G(); if(checkWinner()){ setTimeout(()=>sfx.fanfare(),350); go('winner'); return; }
    let back=g.back||'turn'; if(back==='winner' && g.winner===null) back='turn'; go(back); },
  undo: () => undo(),
  next: () => { const g=G(); push(); g.turn=(g.turn+1)%g.teams.length; g.roll=null; g.card=null; g.swapped=false; sfx.whoosh(); go('turn'); },
  overtime: () => { const g=G(); g.overtime=true; ACT.next(); },
  end: () => { push(); G().done=true; sfx.fanfare(); go('final'); },
  mute: () => { S.muted=!S.muted; render(); if(!S.muted) sfx.tap(); },
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(!['mute','answer','adj'].includes(el.dataset.act)) sfx.tap();
  ACT[el.dataset.act] && ACT[el.dataset.act](el);
});
/* hold-to-peek */
const peek = on => { const b=document.body, was=b.classList.contains('peeking'); b.classList.toggle('peeking', !!on); if(on && !was) haptic(10); };
app.addEventListener('pointerdown', e => { const b=e.target.closest('[data-peek]'); if(!b) return; e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} peek(true); });
['pointerup','pointercancel','blur'].forEach(t => window.addEventListener(t, () => peek(false)));
document.addEventListener('visibilitychange', () => peek(false));
app.addEventListener('contextmenu', e => { if(e.target.closest('[data-peek]')) e.preventDefault(); });
document.addEventListener('keydown', e => { if(e.code==='Space' && document.querySelector('[data-peek]') && !e.target.matches('input')){ e.preventDefault(); peek(true); } });
document.addEventListener('keyup', e => { if(e.code==='Space' && document.body.classList.contains('peeking')){ e.preventDefault(); peek(false); } });
app.addEventListener('input', e => { if(e.target.matches('.field input')){ S.setup.names[+e.target.dataset.i]=e.target.value; save(); } });

let lock=null;
async function wake(){ try{ lock = await navigator.wakeLock?.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.game && !S.game.done) wake(); });

function start(data){
  S = normalizeState(isObj(data) && data.screen ? data : load());
  render();
